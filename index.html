<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>riwux</title>
  <style>
    :root {
      --bg: #0E1116;
      --ink: #F2EFE9;
      --accent: #C9A227;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word {
      font-size: clamp(4.5rem, 16vw, 12rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--ink);
      position: relative;
      line-height: 1;
      opacity: 0;
      transform: translateY(0.35em);
      animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .word {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }

    .corner {
      position: fixed;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: var(--ink);
      opacity: 0.35;
    }

    .corner.tl { top: 2rem; left: 2rem; }
    .corner.br { bottom: 2rem; right: 2rem; }
  </style>
</head>
<body>

<div class="corner tl">riwux</div>
<div class="corner br">2026</div>

<div class="stage">
  <div class="word">riwux</div>
</div>

</body>
</html>
